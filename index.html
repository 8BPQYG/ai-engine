<script>
    let currentElement = null;
    let offsetX = 0;
    let offsetY = 0;
    let selectedNodeId = 'rootNode';

    // Keeps track of the custom code inside each engine node block
    let nodeDataStorage = {
        'rootNode': '// Core runtime initiation logic\nfunction startEngine() {\n    console.log("Core initialized.");\n}'
    };

    function startDrag(e, element) {
        if (
            e.target.hasAttribute('contenteditable') ||
            e.target.classList.contains('delete-btn')
        ) {
            return;
        }

        currentElement = element;

        offsetX = e.clientX - element.getBoundingClientRect().left;
        offsetY = e.clientY - element.getBoundingClientRect().top;

        // --- INSPECTOR PANEL ACTIVE CONNECTIVITY ---
        selectedNodeId = element.id || 'rootNode';
        document.querySelectorAll('.node').forEach(n => n.style.borderColor = '#00e676');
        element.style.borderColor = '#ffffff'; // White highlight for selected node
        
        // Push the clicked node's title and inner code to the right panel
        document.getElementById('inspectorName').value = element.querySelector('.node-header span').innerText;
        document.getElementById('inspectorCode').innerText = nodeDataStorage[selectedNodeId] || '// No custom script initialized.';
        // -------------------------------------------

        document.addEventListener('mousemove', dragEverything);
        document.addEventListener('mouseup', stopDragEverything);
    }

    function dragEverything(e) {
        if (!currentElement) return;

        const container = document
            .getElementById('canvasArea')
            .getBoundingClientRect();

        const leftPosition = e.clientX - container.left - offsetX;
        const topPosition = e.clientY - container.top - offsetY;

        currentElement.style.left = leftPosition + 'px';
        currentElement.style.top = topPosition + 'px';

        updateConnections();
    }

    function stopDragEverything() {
        currentElement = null;

        document.removeEventListener('mousemove', dragEverything);
        document.removeEventListener('mouseup', stopDragEverything);
    }

    function triggerEngineOrchestration() {
        const inputText = document.getElementById('promptInput').value;
        const log = document.getElementById('terminalLog');
        const canvas = document.getElementById('canvasArea');

        if (!inputText.trim()) {
            return alert('Please type a feature component name!');
        }

        log.innerHTML += `<br><span style="color: #00e676;">[USER]: ${inputText}</span>`;
        log.innerHTML += `<br>[SYSTEM]: Spawning linked blueprint node...`;
        log.scrollTop = log.scrollHeight;

        setTimeout(() => {
            const nodeId = 'node_' + Date.now();

            const newNode = document.createElement('div');
            newNode.className = 'node';
            newNode.id = nodeId;

            const randomTop = Math.floor(Math.random() * 250 + 100);
            const randomLeft = Math.floor(Math.random() * 250 + 400);

            newNode.style.top = randomTop + 'px';
            newNode.style.left = randomLeft + 'px';
            newNode.setAttribute('onmousedown', 'startDrag(event, this)');

            const nodeTitle = inputText.length > 15 ? inputText.substring(0, 15) + '...' : inputText;

            newNode.innerHTML = `
                <div class="node-header">
                    <span>AI_${nodeTitle}</span>
                    <span class="delete-btn" onclick="removeNode('${nodeId}')">×</span>
                </div>
                <div class="node-body">Pipeline component active.</div>
            `;

            // Auto-generates starter code for your new node
            nodeDataStorage[nodeId] = '// AI Compiled Script for ' + inputText + '\nfunction execute' + nodeTitle.replace(/[^a-zA-Z0-9]/g, '') + '() {\n    // System parameters ready\n}';

            canvas.appendChild(newNode);
            document.getElementById('promptInput').value = '';

            log.innerHTML += `<br>[COMPILER]: Connected to Core pipeline successfully.`;
            log.scrollTop = log.scrollHeight;

            updateConnections();
        }, 500);
    }

    function updateConnections() {
        const svg = document.getElementById('lineLayer');
        const canvas = document.getElementById('canvasArea');
        const root = document.getElementById('rootNode');

        svg.innerHTML = '';

        if (!root) return;

        const canvasRect = canvas.getBoundingClientRect();
        const rootRect = root.getBoundingClientRect();

        const startX = rootRect.left - canvasRect.left + rootRect.width;
        const startY = rootRect.top - canvasRect.top + rootRect.height / 2;

        const targetNodes = document.querySelectorAll('.node:not(#rootNode)');

        targetNodes.forEach(node => {
            const nodeRect = node.getBoundingClientRect();

            const endX = nodeRect.left - canvasRect.left;
            const endY = nodeRect.top - canvasRect.top + nodeRect.height / 2;

            const controlOffset = Math.abs(endX - startX) * 0.5;

            const pathData =
                `M ${startX} ${startY} ` +
                `C ${startX + controlOffset} ${startY}, ` +
                `${endX - controlOffset} ${endY}, ` +
                `${endX} ${endY}`;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

            path.setAttribute('d', pathData);
            path.setAttribute('stroke', '#00e676');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            path.setAttribute('style', 'opacity: 0.65; stroke-dasharray: 4;');

            svg.appendChild(path);
        });
    }

    function removeNode(id) {
        const element = document.getElementById(id);

        if (element) {
            element.remove();
            delete nodeDataStorage[id]; // Cleans up the code memory database
            updateConnections();
        }
    }

    // Connects inspector text typing to update the canvas labels dynamically
    function updateSelectedNodeName(val) {
        if (!selectedNodeId) return;
        const target = document.getElementById(selectedNodeId);
        if (target) target.querySelector('.node-header span').innerText = val;
    }

    function updateSelectedNodeCode(val) {
        if (!selectedNodeId) return;
        nodeDataStorage[selectedNodeId] = val;
    }

    window.addEventListener('resize', updateConnections);
</script>
